name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions: {}

jobs:
  ci:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Request local CI
        shell: bash
        run: |
          set -Eeuo pipefail

          AUDIENCE="https://deploy.komedajob.com"
          ENDPOINT="https://deploy.komedajob.com/hooks/run-ci"

          TOKEN="$(
            curl -fsS \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
              | jq -er '.value'
          )"

          echo "::add-mask::${TOKEN}"

          jq -ce '{
            action: .action,
            repository: {
              full_name: .repository.full_name
            },
            pull_request: {
              head: {
                sha: .pull_request.head.sha
              }
            }
          }' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/ci-payload.json"

          curl --fail-with-body -fsS \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST "$ENDPOINT" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/ci-payload.json"

          echo "Local CI request accepted"
