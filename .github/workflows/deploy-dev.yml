name: Deploy Dev

on:
  pull_request:
    types:
      - closed
    branches:
      - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Get OIDC token
        id: oidc
        run: |
          set -euo pipefail

          TOKEN="$(
            curl \
              --fail \
              --silent \
              --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://deploy.komedajob.com" \
            | jq -r '.value'
          )"

          if [[ -z "${TOKEN}" || "${TOKEN}" == "null" ]]; then
            echo "Failed to acquire OIDC token."
            exit 1
          fi

          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Deploy
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          jq -n \
            --arg commit_sha "${COMMIT_SHA}" \
            '{
              commit_sha: $commit_sha
            }' \
          | curl \
              --fail \
              --silent \
              --show-error \
              -X POST \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @- \
              https://deploy.komedajob.com/hooks/deploy-dev
