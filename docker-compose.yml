name: "Compose Healthcheck"

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  compose-healthcheck:
    name: "Docker Compose Healthcheck"
    runs-on: ubuntu-latest

    env:
      LOCAL_INFISICAL_CLIENT_ID: ${{ secrets.LOCAL_INFISICAL_CLIENT_ID }}
      LOCAL_INFISICAL_CLIENT_SECRET: ${{ secrets.LOCAL_INFISICAL_CLIENT_SECRET }}
      LOCAL_INFISICAL_PROJECT_ID: ${{ secrets.LOCAL_INFISICAL_PROJECT_ID }}

      AISTOR_LICENSE: ${{ secrets.AISTOR_LICENSE }}
      MINIO_LICENSE_PATH: /home/runner/minio/minio.license
      MINIO_DATA_PATH: /tmp/minio-data

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sample_db

      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: videos

      NAS_USERNAME: dummy
      NAS_PASSWORD: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare MinIO
        run: |
          mkdir -p /home/runner/minio
          mkdir -p /tmp/minio-data
          echo "${AISTOR_LICENSE}" > /home/runner/minio/minio.license

      - name: Install dependencies
        run: yarn install --immutable

      - name: Start containers
        run: |
          set +e

          node ./node_modules/infisicalLauncher/dist/index.cjs \
            --path=/videoStreaming/container \
            -- \
            docker compose \
              -f docker-compose.yml \
              --profile frontend \
              --profile backend \
              up -d --build --wait

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "========================================"
            echo "docker compose ps"
            echo "========================================"

            docker compose \
              -f docker-compose.yml \
              --profile frontend \
              --profile backend \
              ps -a || true

            echo "========================================"
            echo "docker compose logs"
            echo "========================================"

            docker compose \
              -f docker-compose.yml \
              --profile frontend \
              --profile backend \
              logs \
              --no-color || true

            exit "$STATUS"
          fi

      - name: Show container status
        run: |
          docker compose \
            -f docker-compose.yml \
            --profile frontend \
            --profile backend \
            ps

      - name: Cleanup
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            --profile frontend \
            --profile backend \
            down \
            --remove-orphans
