services:
  video-streaming-service-frontend:
    container_name: video-streaming-service-frontend
    profiles:
      - frontend
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      ssh:
        - default
    restart: always
    ports:
      - 3000:3000
  video-streaming-service-backend:
    container_name: video-streaming-service-backend
    profiles:
      - backend
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      ssh:
        - default
    restart: always
    ports:
      - 8080:8080
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
  db:
    container_name: db-video-streaming-service
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  migration:
    container_name: migration-video-streaming-service
    image: arigaio/atlas:latest-alpine
    profiles:
      - backend
      - migration
    restart: "no"
    volumes:
      - ./apps/backend/db/migration:/migrations:ro
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    command:
      - migrate
      - apply
      - --dir=file:///migrations
      - --url=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
  minio:
    container_name: minio-video-streaming-service
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.11.83/minio$"
      o: "username=${NAS_USERNAME},password=${NAS_PASSWORD},vers=3.0,file_mode=0660,dir_mode=0770"