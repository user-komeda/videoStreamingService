[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''apps/backend/\.testcoverage\.yml''',
  '''node_modules''',
  '''yarn\.lock''',
  '''\.github/workflows/ci\.yml''',
  '''\.github/workflows/compose-healthcheck.yml''',
  '''_test\.go$''',
  '''\.(test|spec)\.(ts|tsx|js|jsx)$''',
  '''(^|/)test/''',
  '''(^|/)tests/''',
  '''(^|/)e2e/''',
]
